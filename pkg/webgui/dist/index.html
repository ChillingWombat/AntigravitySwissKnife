<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity Swiss Knife</title>
    <style>:root{--surface:#f0f4f9;--canvas:#f8fafd}:root[data-theme=dark]{--surface:#1e1f20;--canvas:#131314}body{background-color:var(--canvas);margin:0}</style>
    <script>
      // Apply the stored theme before the app bundle paints to avoid a flash
      // of the wrong theme. Mirrors the resolution logic in src/theme.ts.
      (function () {
        try {
          var mode = localStorage.getItem('antigravity_theme') || 'auto';
          var dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DFfwTGBT.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-KwqmbKHV.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
