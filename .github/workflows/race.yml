name: Race & Concurrency CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: race-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-race:
    name: Go Test -race (Ubuntu with CGO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: false
          cache: true

      - name: Verify CGO and GCC Environment
        run: |
          go env CGO_ENABLED
          gcc --version

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Go Unit Tests with Race Detector
        env:
          CGO_ENABLED: '1'
          GH_TOKEN: ${{ github.token }}
        run: go test -v -race -timeout 10m -count=1 ./pkg/... ./cmd/...

      - name: Run antigravity-acp Tests with Race Detector
        env:
          CGO_ENABLED: '1'
          GH_TOKEN: ${{ github.token }}
        working-directory: ./antigravity-acp
        run: go test -v -race -timeout 5m -count=1 ./...

  go-windows:
    name: Go Test Platform Verification (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: false
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Standard Go Tests on Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: go test -v -timeout 10m -count=1 ./pkg/... ./cmd/...

      - name: Run antigravity-acp Tests on Windows
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ./antigravity-acp
        run: go test -v -timeout 5m -count=1 ./...

  go-macos:
    name: Go Test Platform Verification (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: false
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Standard Go Tests on macOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: go test -v -timeout 10m -count=1 ./pkg/... ./cmd/...

      - name: Run antigravity-acp Tests on macOS
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ./antigravity-acp
        run: go test -v -timeout 5m -count=1 ./...

  frontend-test:
    name: Electron & Frontend Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron test dependencies
        run: npm ci --include=dev

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Electron tests
        run: node --test electron/tray-account-menu.test.js electron/navigation-security.test.js

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Build canonical web GUI
        run: npm run build:frontend

      - name: Test web GUI dist checks
        run: node --test scripts/check-webgui-dist.test.js

      - name: Check web GUI dist assets
        run: node scripts/check-webgui-dist.js

      - name: Check web GUI dist drift
        run: git diff --exit-code -- pkg/webgui/dist

  injected-runtime:
    name: Injected Runtime Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: injected-runtime/package-lock.json

      - name: Install injected runtime dependencies
        run: npm ci --prefix injected-runtime

      - name: Typecheck injected runtime
        run: npm run typecheck --prefix injected-runtime

      - name: Test injected runtime
        run: npm test --prefix injected-runtime

      - name: Build injected runtime
        run: npm run build --prefix injected-runtime

      - name: Check runtime contract
        run: node scripts/check-injected-runtime.mjs

      - name: Check generated asset drift
        run: git diff --exit-code -- pkg/injected/assets/runtime.js
