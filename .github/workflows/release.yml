name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Description'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Release tag (defaults to the dispatched workflow ref)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-scan:
    name: Security Scan & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go (1.26.x)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Codex Security Scan & Vulnerability Audit
        run: |
          echo "Executing Codex Security scan and pre-release security verification..."
          if command -v codex-security >/dev/null 2>&1; then
            codex-security scan . --dry-run
          else
            echo "codex-security is unavailable; running go vet instead."
            go vet ./...
          fi
          npm audit --audit-level=critical

  build-and-package:
    name: Build & Package (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            platform: linux
            name: Linux (Debian)
            artifact_ext: deb
            script: release:linux
          - os: windows-latest
            platform: windows
            name: Windows (NSIS)
            artifact_ext: exe
            script: release:win
          - os: macos-latest
            platform: macos
            name: macOS (Apple DMG)
            artifact_ext: dmg
            script: release:mac
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (1.26.x)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci --include=dev

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build production frontend bundle
        run: npm run build:frontend

      - name: Compile Go binary
        run: npm run build:go

      - name: Compile native daemon and package standard OS installer
        run: npm run ${{ matrix.target.script }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target.platform }}
          path: |
            release/${{ matrix.target.platform }}/*.${{ matrix.target.artifact_ext }}
            release/*/*.deb
            release/*/*.exe
            release/*/*.dmg
            dist-desktop/*.${{ matrix.target.artifact_ext }}
          if-no-files-found: error

  publish-release:
    name: Publish Official GitHub Release
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-package]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all matrix artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        id: checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo 'sha256<<EOF'
            cat SHA256SUMS.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
          prerelease: ${{ github.event.inputs.prerelease == 'true' || false }}
          body: |
            ${{ github.event.inputs.release_notes || 'Official production release of Antigravity Swiss Knife installers for Linux (.deb), Windows (.exe), and macOS (.dmg).' }}

            ## SHA256SUMS.txt

            ```
            ${{ steps.checksums.outputs.sha256 }}
            ```
          generate_release_notes: true
