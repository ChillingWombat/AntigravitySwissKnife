<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="lightShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="#f8fafc"/>

  <!-- Subtle grid dots/lines -->
  <g stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 4">
    <line x1="60" y1="0" x2="60" y2="680"/>
    <line x1="1140" y1="0" x2="1140" y2="680"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Antigravity Swiss Knife — System Architecture</text>
    <text x="0" y="24" font-size="12" fill="#64748b">Native companion daemon, desktop supervisory interface, and runtime extension architecture</text>
  </g>

  <!-- Badges -->
  <g transform="translate(900, 32)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="50" y="17" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">Go 1.22+</text>
    <rect x="112" y="0" width="128" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="176" y="17" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">Electron / React 19</text>
  </g>

  <!-- SECTION 1: TOP USER SURFACES -->
  <!-- Box 1A: Host Runtime (Antigravity 2.0 Desktop) -->
  <g transform="translate(60, 92)" filter="url(#lightShadow)">
    <rect width="510" height="154" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="510" height="4" rx="2" fill="#0284c7"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0f172a">Google Antigravity 2.0 (Host Desktop App)</text>
    <text x="20" y="48" font-size="11" fill="#64748b">Target application runtime environment (/opt/Antigravity)</text>

    <!-- 3 Sub-pills -->
    <g transform="translate(20, 64)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="146" height="72" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#0369a1">Persistent Scripts</text>
        <text x="12" y="42" font-size="10" fill="#475569">persistent_script.js</text>
        <text x="12" y="58" font-size="10" fill="#64748b">persistent_styles.css</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(162, 0)">
        <rect width="146" height="72" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#0369a1">Turn Navigation</text>
        <text x="12" y="42" font-size="10" fill="#475569">Prompt Jump History</text>
        <text x="12" y="58" font-size="10" fill="#64748b">Density Filtering</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(324, 0)">
        <rect width="146" height="72" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#0369a1">In-Chat Telemetry</text>
        <text x="12" y="42" font-size="10" fill="#475569">Live TPS Metrics</text>
        <text x="12" y="58" font-size="10" fill="#64748b">Turn Token Count</text>
      </g>
    </g>
  </g>

  <!-- Box 1B: Swiss Knife Companion GUI -->
  <g transform="translate(630, 92)" filter="url(#lightShadow)">
    <rect width="510" height="154" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="510" height="4" rx="2" fill="#7c3aed"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0f172a">Swiss Knife Desktop Application (GUI)</text>
    <text x="20" y="48" font-size="11" fill="#64748b">Companion supervisory control center and extension workspace</text>

    <!-- 3 Sub-pills -->
    <g transform="translate(20, 64)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="146" height="72" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#6b21a8">Fleet Quotas</text>
        <text x="12" y="42" font-size="10" fill="#475569">Multi-Account Rotation</text>
        <text x="12" y="58" font-size="10" fill="#64748b">RFC 6238 TOTP Vault</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(162, 0)">
        <rect width="146" height="72" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#6b21a8">Auditor &amp; Relays</text>
        <text x="12" y="42" font-size="10" fill="#475569">6-Probe Security Suite</text>
        <text x="12" y="58" font-size="10" fill="#64748b">Canary Downgrade Test</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(324, 0)">
        <rect width="146" height="72" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#6b21a8">Workspace Panels</text>
        <text x="12" y="42" font-size="10" fill="#475569">Preview Browser</text>
        <text x="12" y="58" font-size="10" fill="#64748b">GitHub Kanban &amp; Memos</text>
      </g>
    </g>
  </g>

  <!-- INTER-LAYER IPC BUS -->
  <g transform="translate(60, 268)">
    <rect width="1080" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1.2"/>
    <text x="540" y="21" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">
      Local IPC Bus: Unix Domain Socket (<tspan font-weight="700" fill="#0284c7">/run/user/1000/antigravity-swiss/daemon.sock</tspan>) &amp; Localhost HTTP (<tspan font-weight="700" fill="#0284c7">127.0.0.1:8765</tspan>)
    </text>
  </g>

  <!-- Connecting Lines -->
  <line x1="315" y1="246" x2="315" y2="268" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="885" y1="246" x2="885" y2="268" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="315" y1="302" x2="315" y2="324" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="885" y1="302" x2="885" y2="324" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- SECTION 2: CORE COMPANION DAEMON (CENTER) -->
  <g transform="translate(60, 324)" filter="url(#lightShadow)">
    <rect width="1080" height="174" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="1080" height="4" rx="2" fill="#10b981"/>
    <text x="20" y="30" font-size="14" font-weight="700" fill="#0f172a">Swiss Companion Daemon (Headless Go Engine — bin/swiss daemon)</text>
    <text x="20" y="48" font-size="11" fill="#64748b">Zero-CGo native binary orchestrating local credential switching, telemetry, and background lifecycle</text>

    <!-- 5 Daemon Engines -->
    <g transform="translate(20, 64)">
      <!-- Engine 1 -->
      <g transform="translate(0, 0)">
        <rect width="196" height="92" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#15803d">Keyring &amp; Switcher</text>
        <text x="12" y="42" font-size="10" fill="#334155">• OAuth2 Token Extraction</text>
        <text x="12" y="58" font-size="10" fill="#334155">• Secret Service Sync</text>
        <text x="12" y="74" font-size="10" fill="#64748b">• Session Lock Avoidance</text>
      </g>
      <!-- Engine 2 -->
      <g transform="translate(210, 0)">
        <rect width="196" height="92" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#15803d">Hardware Profile</text>
        <text x="12" y="42" font-size="10" fill="#334155">• machineid Isolation</text>
        <text x="12" y="58" font-size="10" fill="#334155">• .updaterId Virtualization</text>
        <text x="12" y="74" font-size="10" fill="#64748b">• installation_uuid Rotation</text>
      </g>
      <!-- Engine 3 -->
      <g transform="translate(420, 0)">
        <rect width="196" height="92" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#15803d">Token Accounting</text>
        <text x="12" y="42" font-size="10" fill="#334155">• SQLite Local Ledger</text>
        <text x="12" y="58" font-size="10" fill="#334155">• Dynamic Cost Normalization</text>
        <text x="12" y="74" font-size="10" fill="#64748b">• LiteLLM / OpenRouter Index</text>
      </g>
      <!-- Engine 4 -->
      <g transform="translate(630, 0)">
        <rect width="196" height="92" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#15803d">Process Lock &amp; Safety</text>
        <text x="12" y="42" font-size="10" fill="#334155">• Atomic Singleton Guard</text>
        <text x="12" y="58" font-size="10" fill="#334155">• Pristine .swiss.bak Snapshots</text>
        <text x="12" y="74" font-size="10" fill="#64748b">• Auto-Update Pause Sensor</text>
      </g>
      <!-- Engine 5 -->
      <g transform="translate(840, 0)">
        <rect width="196" height="92" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#15803d">CDP Refresher</text>
        <text x="12" y="42" font-size="10" fill="#334155">• Live React Fiber Patch</text>
        <text x="12" y="58" font-size="10" fill="#334155">• 1-Token Warmup Probe</text>
        <text x="12" y="74" font-size="10" fill="#64748b">• Zero-Restart Window Sync</text>
      </g>
    </g>
  </g>

  <!-- Connectors from Daemon to Lower Subsystems -->
  <line x1="315" y1="498" x2="315" y2="520" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="885" y1="498" x2="885" y2="520" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <!-- SECTION 3: STORAGE & PROTOCOLS (BOTTOM) -->
  <!-- Box 3A: OS Keyring & Storage -->
  <g transform="translate(60, 520)" filter="url(#lightShadow)">
    <rect width="510" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="510" height="4" rx="2" fill="#d97706"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#0f172a">Operating System Keyring &amp; Local Storage</text>
    <text x="20" y="46" font-size="11" fill="#64748b">Zero unencrypted credentials on disk; native OS credential vaults</text>

    <!-- 3 Pills -->
    <g transform="translate(20, 58)">
      <g transform="translate(0, 0)">
        <rect width="146" height="52" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#b45309">Linux Secret Service</text>
        <text x="12" y="40" font-size="10" fill="#78350f">libsecret / secret-tool</text>
      </g>
      <g transform="translate(162, 0)">
        <rect width="146" height="52" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#b45309">macOS Keychain</text>
        <text x="12" y="40" font-size="10" fill="#78350f">Apple Security Vault</text>
      </g>
      <g transform="translate(324, 0)">
        <rect width="146" height="52" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#b45309">Windows Credential</text>
        <text x="12" y="40" font-size="10" fill="#78350f">wincred DPAPI Store</text>
      </g>
    </g>
  </g>

  <!-- Box 3B: Upstream & External Integrations -->
  <g transform="translate(630, 520)" filter="url(#lightShadow)">
    <rect width="510" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="510" height="4" rx="2" fill="#0d9488"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#0f172a">Upstream Protocols &amp; External Integrations</text>
    <text x="20" y="46" font-size="11" fill="#64748b">Direct HTTPS endpoints without intermediary proxy interception</text>

    <!-- 3 Pills -->
    <g transform="translate(20, 58)">
      <g transform="translate(0, 0)">
        <rect width="146" height="52" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#0f766e">Google CloudCode</text>
        <text x="12" y="40" font-size="10" fill="#134e4a">Direct Loopback HTTPS</text>
      </g>
      <g transform="translate(162, 0)">
        <rect width="146" height="52" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#0f766e">GitHub REST / GraphQL</text>
        <text x="12" y="40" font-size="10" fill="#134e4a">Issues &amp; Projects Sync</text>
      </g>
      <g transform="translate(324, 0)">
        <rect width="146" height="52" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
        <text x="12" y="22" font-size="11" font-weight="700" fill="#0f766e">Custom Model APIs</text>
        <text x="12" y="40" font-size="10" fill="#134e4a">Direct Provider Endpoints</text>
      </g>
    </g>
  </g>
</svg>
