<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="lightShadowFeat" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#f8fafc"/>

  <!-- Subtle grid lines -->
  <g stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 4">
    <line x1="60" y1="0" x2="60" y2="560"/>
    <line x1="1140" y1="0" x2="1140" y2="560"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Antigravity Swiss Knife — Key Features</text>
    <text x="0" y="24" font-size="12" fill="#64748b">Unified developer companion suite engineered for productivity, security, and local-first execution</text>
  </g>

  <!-- Tag on Top Right -->
  <g transform="translate(980, 32)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="17" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">7 Integrated Modules</text>
  </g>

  <!-- ROW 1 (y = 96, 4 cards: width 255 each, gap 20) -->
  <!-- Feature 1: Account Switcher -->
  <g transform="translate(60, 96)" filter="url(#lightShadowFeat)">
    <rect width="255" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#0284c7"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#0284c7" letter-spacing="0.05em">01. FLEET MANAGEMENT</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Account Switcher</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Multi-account quota tracking</text>
    <text x="18" y="94" font-size="11" fill="#334155">• Hardware profile virtualization</text>
    <text x="18" y="116" font-size="11" fill="#334155">• RFC 6238 TOTP 2FA vault</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Warmup probe &amp; keep-alive</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Zero-restart live CDP patch</text>
  </g>

  <!-- Feature 2: Custom Model -->
  <g transform="translate(335, 96)" filter="url(#lightShadowFeat)">
    <rect width="255" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#7c3aed"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#7c3aed" letter-spacing="0.05em">02. MODEL GATEWAY</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Custom Model</text>
    <text x="18" y="72" font-size="11" fill="#334155">• OpenAI, Claude, DeepSeek</text>
    <text x="18" y="94" font-size="11" fill="#334155">• 6-probe security relay auditor</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Canary downgrade detection</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Prompt tampering defense</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Dynamic token pricing catalog</text>
  </g>

  <!-- Feature 3: UI Enhancement -->
  <g transform="translate(610, 96)" filter="url(#lightShadowFeat)">
    <rect width="255" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#059669"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#059669" letter-spacing="0.05em">03. CHAT WORKSPACE</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">UI Enhancement</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Conversation turn jumping</text>
    <text x="18" y="94" font-size="11" fill="#334155">• Collapsible tool output blocks</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Real-time TPS metrics display</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Per-turn token usage counter</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Clean layout density controls</text>
  </g>

  <!-- Feature 4: Preview Browser -->
  <g transform="translate(885, 96)" filter="url(#lightShadowFeat)">
    <rect width="255" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#d97706"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#d97706" letter-spacing="0.05em">04. WEB DEVELOPMENT</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Preview Browser</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Multi-port dev server testing</text>
    <text x="18" y="94" font-size="11" fill="#334155">• Integrated embedded web view</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Developer toolbar &amp; ports dock</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Instant reload &amp; inspection</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Sidecar web preview panel</text>
  </g>

  <!-- ROW 2 (y = 315, 3 cards: width 346 each, gap 20) -->
  <!-- Feature 5: File Explorer -->
  <g transform="translate(60, 315)" filter="url(#lightShadowFeat)">
    <rect width="346" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="346" height="4" rx="2" fill="#0284c7"/>
    <text x="20" y="26" font-size="10" font-weight="700" fill="#0284c7" letter-spacing="0.05em">05. WORKSPACE EXPLORATION</text>
    <text x="20" y="48" font-size="15" font-weight="700" fill="#0f172a">File Explorer</text>
    <text x="20" y="72" font-size="11" fill="#334155">• Project folder tree browsing with breadcrumb path</text>
    <text x="20" y="94" font-size="11" fill="#334155">• Instant file filtering and recursive fuzzy search</text>
    <text x="20" y="116" font-size="11" fill="#334155">• Code syntax preview with monospaced line viewer</text>
    <text x="20" y="138" font-size="11" fill="#334155">• Quick file scratchpad and atomic edits</text>
    <text x="20" y="160" font-size="11" fill="#64748b">• Native system file manager opener</text>
  </g>

  <!-- Feature 6: GitHub Workspace -->
  <g transform="translate(426, 315)" filter="url(#lightShadowFeat)">
    <rect width="346" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="346" height="4" rx="2" fill="#6366f1"/>
    <text x="20" y="26" font-size="10" font-weight="700" fill="#6366f1" letter-spacing="0.05em">06. ISSUE &amp; AGENT TRACKING</text>
    <text x="20" y="48" font-size="15" font-weight="700" fill="#0f172a">GitHub Workspace</text>
    <text x="20" y="72" font-size="11" fill="#334155">• Interactive Kanban project board (Backlog ➔ Done)</text>
    <text x="20" y="94" font-size="11" fill="#334155">• Subagent conversation tracking &amp; jump-to-chat</text>
    <text x="20" y="116" font-size="11" fill="#334155">• Stage management, issue filtering &amp; PR links</text>
    <text x="20" y="138" font-size="11" fill="#334155">• Multi-project switcher &amp; category sidebar</text>
    <text x="20" y="160" font-size="11" fill="#64748b">• Local state persistence &amp; GitHub API sync</text>
  </g>

  <!-- Feature 7: Quick Memo -->
  <g transform="translate(792, 315)" filter="url(#lightShadowFeat)">
    <rect width="348" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="348" height="4" rx="2" fill="#0d9488"/>
    <text x="20" y="26" font-size="10" font-weight="700" fill="#0d9488" letter-spacing="0.05em">07. KNOWLEDGE CAPTURE</text>
    <text x="20" y="48" font-size="15" font-weight="700" fill="#0f172a">Quick Memo</text>
    <text x="20" y="72" font-size="11" fill="#334155">• Instant developer notes with Markdown support</text>
    <text x="20" y="94" font-size="11" fill="#334155">• Built-in audio voice memo recording &amp; transcription</text>
    <text x="20" y="116" font-size="11" fill="#334155">• Categorized tagging, favorites &amp; color accents</text>
    <text x="20" y="138" font-size="11" fill="#334155">• Full-text fuzzy search across notes and transcripts</text>
    <text x="20" y="160" font-size="11" fill="#64748b">• Local JSON storage with one-click export</text>
  </g>
</svg>
