<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadowModLight" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="580" fill="#f8fafc"/>

  <!-- Subtle grid lines -->
  <g stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 4">
    <line x1="60" y1="0" x2="60" y2="580"/>
    <line x1="1140" y1="0" x2="1140" y2="580"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Antigravity Swiss Knife — Functional Modules</text>
    <text x="0" y="24" font-size="12" fill="#64748b">Eight unified subsystems engineered for local-first execution, security, and developer productivity</text>
  </g>

  <!-- 4 x 2 Grid of Module Cards -->
  <!-- ROW 1 (y = 96) -->
  <!-- Card 1: Account Switcher -->
  <g transform="translate(60, 96)" filter="url(#shadowModLight)">
    <rect width="255" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#0284c7"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#0284c7" letter-spacing="0.05em">01. FLEET MANAGEMENT</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Account Switcher</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Multi-account quota tracking</text>
    <text x="18" y="94" font-size="11" fill="#334155">• RFC 6238 TOTP 2FA vault</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Hardware profile virtualization</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Reset horizon keep-alive warmup</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Zero-loss session preservation</text>
  </g>

  <!-- Card 2: Custom Models & Audit -->
  <g transform="translate(335, 96)" filter="url(#shadowModLight)">
    <rect width="255" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#7c3aed"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#7c3aed" letter-spacing="0.05em">02. MODEL ROUTING</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Custom Models &amp; Audit</text>
    <text x="18" y="72" font-size="11" fill="#334155">• OpenAI, Claude, DeepSeek</text>
    <text x="18" y="94" font-size="11" fill="#334155">• 6-probe security relay auditor</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Model substitution canary checks</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Prompt injection &amp; leakage guard</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Upstream latency evaluation</text>
  </g>

  <!-- Card 3: UI Enhancements -->
  <g transform="translate(610, 96)" filter="url(#shadowModLight)">
    <rect width="255" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#059669"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#059669" letter-spacing="0.05em">03. WORKSPACE TOOLS</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Chat Navigation &amp; View</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Fast turn jump navigation</text>
    <text x="18" y="94" font-size="11" fill="#334155">• Collapsible tool invocation cards</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Real-time token output display</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Prompt history jumping</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Clean layout density toggles</text>
  </g>

  <!-- Card 4: Preview Browser -->
  <g transform="translate(885, 96)" filter="url(#shadowModLight)">
    <rect width="255" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#d97706"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#d97706" letter-spacing="0.05em">04. AUXILIARY BROWSER</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Preview Browser</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Embedded multi-port web viewer</text>
    <text x="18" y="94" font-size="11" fill="#334155">• Localhost auto-detection</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Quick port navigation dock</text>
    <text x="18" y="138" font-size="11" fill="#334155">• DevTools inspection</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Session isolation per tab</text>
  </g>

  <!-- ROW 2 (y = 320) -->
  <!-- Card 5: File Explorer -->
  <g transform="translate(60, 320)" filter="url(#shadowModLight)">
    <rect width="255" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#2563eb"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#2563eb" letter-spacing="0.05em">05. WORKSPACE EXPLORER</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">File Explorer</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Fast workspace directory tree</text>
    <text x="18" y="94" font-size="11" fill="#334155">• Instant file filtering &amp; search</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Syntax-highlighted code preview</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Quick file edits &amp; scratchpad</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• System file manager integration</text>
  </g>

  <!-- Card 6: GitHub Workspace -->
  <g transform="translate(335, 320)" filter="url(#shadowModLight)">
    <rect width="255" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#6366f1"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#6366f1" letter-spacing="0.05em">06. ISSUE &amp; AGENT TRACKER</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">GitHub Workspace</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Interactive Kanban project board</text>
    <text x="18" y="94" font-size="11" fill="#334155">• Subagent conversation jump links</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Issue lifecycle state updates</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Multi-project board switcher</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Category context management</text>
  </g>

  <!-- Card 7: Quick Memo -->
  <g transform="translate(610, 320)" filter="url(#shadowModLight)">
    <rect width="255" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#0d9488"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#0d9488" letter-spacing="0.05em">07. NOTE TAKING</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Quick Memo</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Instant Markdown developer notes</text>
    <text x="18" y="94" font-size="11" fill="#334155">• Audio voice memo recording</text>
    <text x="18" y="116" font-size="11" fill="#334155">• Speech-to-text transcript sync</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Tagging, favorites &amp; color filters</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Instant full-text search</text>
  </g>

  <!-- Card 8: System Settings & Reversibility -->
  <g transform="translate(885, 320)" filter="url(#shadowModLight)">
    <rect width="255" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="255" height="4" rx="2" fill="#e11d48"/>
    <text x="18" y="26" font-size="10" font-weight="700" fill="#e11d48" letter-spacing="0.05em">08. SECURITY &amp; SAFETY</text>
    <text x="18" y="48" font-size="15" font-weight="700" fill="#0f172a">Safety &amp; Reversibility</text>
    <text x="18" y="72" font-size="11" fill="#334155">• Atomic .swiss.bak snapshot engine</text>
    <text x="18" y="94" font-size="11" fill="#334155">• One-click clean uninject restoration</text>
    <text x="18" y="116" font-size="11" fill="#334155">• In-flight auto-update sensor</text>
    <text x="18" y="138" font-size="11" fill="#334155">• Zero-CGo pure-Go persistence</text>
    <text x="18" y="160" font-size="11" fill="#64748b">• Loopback-only communication</text>
  </g>
</svg>
