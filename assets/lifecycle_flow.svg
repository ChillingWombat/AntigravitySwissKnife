<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadowFlowLight" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="1200" height="480" fill="#f8fafc"/>

  <!-- Subtle grid lines -->
  <g stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 4">
    <line x1="60" y1="0" x2="60" y2="480"/>
    <line x1="1140" y1="0" x2="1140" y2="480"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">Antigravity Swiss Knife — Credential Rotation Lifecycle</text>
    <text x="0" y="24" font-size="12" fill="#64748b">Zero-loss atomic account switching flow with Chrome DevTools Protocol state synchronization</text>
  </g>

  <!-- Horizontal Flow of 5 Steps -->
  <!-- Step 1: Trigger -->
  <g transform="translate(60, 110)" filter="url(#shadowFlowLight)">
    <rect width="200" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="#0284c7"/>
    <circle cx="36" cy="38" r="16" fill="#e0f2fe"/>
    <text x="36" y="43" font-size="13" font-weight="800" fill="#0284c7" text-anchor="middle">1</text>
    <text x="64" y="42" font-size="14" font-weight="700" fill="#0f172a">Trigger</text>
    
    <text x="18" y="80" font-size="11" font-weight="600" fill="#0369a1">Invocation Source:</text>
    <text x="18" y="100" font-size="11" fill="#334155">• Companion GUI modal</text>
    <text x="18" y="120" font-size="11" fill="#334155">• CLI: swiss switch</text>
    <text x="18" y="140" font-size="11" fill="#334155">• Exhaustion threshold</text>
    
    <rect x="18" y="170" width="164" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="26" y="190" font-size="10" font-weight="600" fill="#64748b">Event Dispatch:</text>
    <text x="26" y="208" font-size="10" fill="#475569">Daemon intercepts</text>
    <text x="26" y="224" font-size="10" fill="#475569">switch event via IPC</text>
    <text x="26" y="240" font-size="10" fill="#475569">socket or HTTP call</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="262" y1="240" x2="280" y2="240" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <!-- Step 2: Keyring Synchronization -->
  <g transform="translate(282, 110)" filter="url(#shadowFlowLight)">
    <rect width="200" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="#7c3aed"/>
    <circle cx="36" cy="38" r="16" fill="#f3e8ff"/>
    <text x="36" y="43" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">2</text>
    <text x="64" y="42" font-size="14" font-weight="700" fill="#0f172a">Keyring Sync</text>
    
    <text x="18" y="80" font-size="11" font-weight="600" fill="#6b21a8">Credential Extraction:</text>
    <text x="18" y="100" font-size="11" fill="#334155">• Acquire singleton lock</text>
    <text x="18" y="120" font-size="11" fill="#334155">• Query OS secret store</text>
    <text x="18" y="140" font-size="11" fill="#334155">• Refresh OAuth2 token</text>
    
    <rect x="18" y="170" width="164" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="26" y="190" font-size="10" font-weight="600" fill="#64748b">Security Boundary:</text>
    <text x="26" y="208" font-size="10" fill="#475569">Credentials stay in</text>
    <text x="26" y="224" font-size="10" fill="#475569">system vault; zero</text>
    <text x="26" y="240" font-size="10" fill="#475569">plaintext on disk</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="484" y1="240" x2="502" y2="240" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <!-- Step 3: Fingerprint Isolation -->
  <g transform="translate(504, 110)" filter="url(#shadowFlowLight)">
    <rect width="200" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="#d97706"/>
    <circle cx="36" cy="38" r="16" fill="#fef3c7"/>
    <text x="36" y="43" font-size="13" font-weight="800" fill="#d97706" text-anchor="middle">3</text>
    <text x="64" y="42" font-size="14" font-weight="700" fill="#0f172a">Profile Swap</text>
    
    <text x="18" y="80" font-size="11" font-weight="600" fill="#b45309">Hardware Identity:</text>
    <text x="18" y="100" font-size="11" fill="#334155">• machineid spoofing</text>
    <text x="18" y="120" font-size="11" fill="#334155">• .updaterId swap</text>
    <text x="18" y="140" font-size="11" fill="#334155">• installation_uuid</text>
    
    <rect x="18" y="170" width="164" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="26" y="190" font-size="10" font-weight="600" fill="#64748b">Fingerprint Isolation:</text>
    <text x="26" y="208" font-size="10" fill="#475569">Each account retains</text>
    <text x="26" y="224" font-size="10" fill="#475569">an independent,</text>
    <text x="26" y="240" font-size="10" fill="#475569">stable hardware ID</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="706" y1="240" x2="724" y2="240" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <!-- Step 4: Runtime Update -->
  <g transform="translate(726, 110)" filter="url(#shadowFlowLight)">
    <rect width="200" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="200" height="4" rx="2" fill="#059669"/>
    <circle cx="36" cy="38" r="16" fill="#d1fae5"/>
    <text x="36" y="43" font-size="13" font-weight="800" fill="#059669" text-anchor="middle">4</text>
    <text x="64" y="42" font-size="14" font-weight="700" fill="#0f172a">CDP Live Sync</text>
    
    <text x="18" y="80" font-size="11" font-weight="600" fill="#047857">In-Memory Patching:</text>
    <text x="18" y="100" font-size="11" fill="#334155">• app_storage.json write</text>
    <text x="18" y="120" font-size="11" fill="#334155">• CDP React Fiber pulse</text>
    <text x="18" y="140" font-size="11" fill="#334155">• State tree re-render</text>
    
    <rect x="18" y="170" width="164" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="26" y="190" font-size="10" font-weight="600" fill="#64748b">Zero-Restart UI:</text>
    <text x="26" y="208" font-size="10" fill="#475569">Refreshes state in</text>
    <text x="26" y="224" font-size="10" fill="#475569">real time without</text>
    <text x="26" y="240" font-size="10" fill="#475569">closing active chats</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="928" y1="240" x2="946" y2="240" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowFlow)"/>

  <!-- Step 5: Verification -->
  <g transform="translate(948, 110)" filter="url(#shadowFlowLight)">
    <rect width="192" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="192" height="4" rx="2" fill="#0284c7"/>
    <circle cx="36" cy="38" r="16" fill="#e0f2fe"/>
    <text x="36" y="43" font-size="13" font-weight="800" fill="#0284c7" text-anchor="middle">5</text>
    <text x="64" y="42" font-size="14" font-weight="700" fill="#0f172a">Verification</text>
    
    <text x="18" y="80" font-size="11" font-weight="600" fill="#0369a1">Warmup Probe:</text>
    <text x="18" y="100" font-size="11" fill="#334155">• 1-token health ping</text>
    <text x="18" y="120" font-size="11" fill="#334155">• Prime quota window</text>
    <text x="18" y="140" font-size="11" fill="#334155">• Confirm 200 OK</text>
    
    <rect x="18" y="170" width="156" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="26" y="190" font-size="10" font-weight="600" fill="#64748b">Ready State:</text>
    <text x="26" y="208" font-size="10" fill="#475569">New quota window is</text>
    <text x="26" y="224" font-size="10" fill="#475569">immediately ready</text>
    <text x="26" y="240" font-size="10" fill="#475569">for user prompts</text>
  </g>
</svg>
